  /app/batches/{batch_id}/components:
    post:
      tags: [lab]
      operationId: addBatchComponent
      summary: Add an extra weighing row (rare — normal rows come from createBatch)
      x-source: 03 §3.4
      x-roles: [formulator]
      x-wave: 3
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/CsrfHeader'
