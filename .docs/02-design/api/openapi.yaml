# AI Perfumery Engine design contract; ownership follows the owner's agreement. No new licence.
# Adapted 2026-10-04 from frontend aa572abaede14c11796a1551434858171eb37363.
# Illustrative examples and upstream x-source/PDC references are not approved domain rules.
openapi: 3.1.0
info:
  title: AI Perfumery Engine — Honney REST API (MVP waves 0–5)
  version: 0.2.0-draft
  summary: Design contract for Next.js and Go/Gin; no backend or mock is implemented here.
  description: |
    **Status: local design draft, 2026-10-04.** Adapted from the pinned frontend MVP contract.
    Technology remains Next.js, Go/Gin and PostgreSQL/sqlc+pgx. See ../api-contract.md.
    Includes local rights/logging/formula-export additions; upstream internal source references
    are provenance, not local approval. Scientific models, thresholds and confidence definitions
    remain gated where their underlying evidence is unavailable. Administrative request shapes
    missing reasons/step-up, transient what-if inputs and erasure response details must be completed
    against local rules before their tasks are Ready. This file does not assert semantic completeness.
    Upstream operations carry:

    - `x-source` — `03 §3.x` when the row exists in 03, or `H1` when it was added here (with the PDC that the
      underlying spec change is waiting on, if any).
    - `x-roles` — who may call it. Server enforces; hiding a button in the UI is never access control.
    - `x-wave` — which frontend wave uses it (see frontend-handoff/README §1).

    **Rules that shape this contract (read before building screens):**

    1. The UI never computes, rounds or judges a reported number. Estimates arrive as `ReportedValue`
       (value + interval + tier + provenance) or `MissingValue`; exact/declared numbers arrive as `Quantity`.
       Format with `Intl.NumberFormat` using `display_decimals` from the server — nothing else.
    2. Users with no role see nothing (user decision 2026-09-23). Domain endpoints return 403 for them.
       Exceptions are listed explicitly: public endpoints (`security: []`) and own-account endpoints
       (`x-roles: [authenticated]`), which only ever return the caller's own account data.
    3. Errors are `application/problem+json` (`Problem`) with a stable `code` from the catalogue in `api/README.md`.
       No stack traces, SQL or internal names — ever.
    4. Session = HttpOnly cookie set by the server. Every POST/PUT/PATCH/DELETE also sends `X-CSRF-Token`
       (value from `LoginResult.csrf_token` or `GET /app/auth/session`), kept in memory only.
    5. Weighed amounts and other user-entered decimals are sent as **decimal strings** (e.g. `"2.4987"`) so the
       number of decimals the user typed is preserved exactly (it is tied to the balance's readability).
  license:
    name: Internal design document — not for redistribution
servers:
  - url: /
    description: Same-origin routing to the Go/Gin REST backend; implementation pending

security:
  - sessionCookie: []

tags:
  - name: public
    description: No login needed. Never returns system data.
  - name: auth
    description: Sign-up, e-mail verification, login, MFA, password reset, session.
  - name: account
    description: The caller's own account. Authenticated; no role needed.
  - name: admin
    description: Users and roles (org_admin in own tenant, system_admin across tenants). Needs a fresh MFA step-up.
  - name: home
    description: Dashboard summary for the active tenant.
  - name: reference
    description: Vehicles, product categories, materials, instruments.
  - name: formulas
    description: Formula list, create, versions, modify.
  - name: analyze
    description: Analysis runs, results, predictions, provenance.
  - name: lab
    description: Batches, weighing per item, pre-dilution, mixing sheet and label PDFs.
  - name: compliance
    description: Compliance findings, document vault, completeness, upload.

paths:
  # Local compliance extensions: contract draft, not implemented routes.
  /me/data:
    get:
      operationId: exportMyData
      tags: [account]
      summary: Export the caller's personal data
      x-source: 'local rule.md rule 11; PRIV-002; FR-017'
      x-roles: [authenticated]
      x-wave: 1
      description: Own personal data only; metadata of attributable records, never another user or an owner-IP dataset dump. Log this export.
      responses:
        '200':
          description: Personal-data export; final field inventory follows the erasure/rights design
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    patch:
      operationId: correctMyData
      tags: [account]
      summary: Correct the caller's profile
      x-source: 'local rule.md rule 11; PRIV-002; FR-017'
      x-roles: [authenticated]
      x-wave: 1
      description: Go rejects role or organisation changes. Email correction uses verification before changing the active address. Verify CSRF.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { description: Correction accepted; any email change remains subject to verification }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: eraseMyAccount
      tags: [account]
      summary: Execute the caller's account-erasure workflow
      x-source: 'local rule.md rules 11–15, 30, 47; PRIV-002; FR-017'
      x-roles: [authenticated]
      x-wave: 1
      description: Requires fresh purpose-bound server-verified re-authentication and CSRF; keeps legally retained identity/logs and schedules backup purge. Intake-only deletion requests do not satisfy this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: X-Step-Up-Token
          in: header
          required: true
          schema: { type: string }
          description: Fresh server-issued proof for this caller and erasure action; must verify expiry and purpose
      responses:
        '200':
          description: Erasure workflow result including retained-record exceptions and scheduled backup purge; final response schema pending design
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /app/admin/access-log:
    get:
      operationId: queryAccessLog
      tags: [admin]
      summary: Query authorized access-log metadata
      x-source: 'local rule.md rules 36, 38; LR2; SEC-003'
      x-roles: [org_admin, system_admin]
      x-permission: access_log.query
      x-wave: 1
      description: Server restricts tenant/date/actor scope; the query itself is logged with its reason. Does not return formula contents.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: actor_user_id, in: query, schema: { type: string } }
        - name: X-Access-Reason-Code
          in: header
          required: true
          description: Server-validated audit-purpose code from the reviewed catalogue; no free-form personal data. Proxy/application request logs must not capture the header value.
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      responses:
        '200':
          description: Scoped access-log metadata; final paginated row schema follows the log design
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /app/admin/access-log/export:
    get:
      operationId: exportAccessLog
      tags: [admin]
      summary: Export authorized access-log metadata
      x-source: 'local rule.md rules 28, 36, 38; LR2; SEC-003'
      x-roles: [org_admin, system_admin]
      x-permission: access_log.export
      x-wave: 1
      description: Same scope as queryAccessLog; query and download are both logged. No formula bodies, passwords or sensitive data.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: actor_user_id, in: query, schema: { type: string } }
        - name: X-Access-Reason-Code
          in: header
          required: true
          description: Server-validated audit-purpose code from the reviewed catalogue; no free-form personal data. Proxy/application request logs must not capture the header value.
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      responses:
        '200':
          description: Scoped metadata download; format is pending approval
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /app/formulas/{formula_id}/export:
    get:
      operationId: exportFormula
      tags: [formulas]
      summary: Export one authorized displayed formula snapshot
      x-source: 'local FR-008; IP-003; rule.md rules 28, 31'
      x-roles: ['≥1 UserRole (tenant owner)']
      x-permission: formula.export
      x-wave: 3
      description: Restrict to the active tenant and one displayed immutable formula version. Never export dataset/rule tables or other formulas. Log formula_id and version, not the body. Transient what-if export request remains gated.
      parameters:
        - name: formula_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scoped formula download; chosen file format/layout pending approval
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ───────────────────────────── public ─────────────────────────────
  /app/public/config:
    get:
      tags: [public]
      operationId: getPublicConfig
      summary: Settings the UI needs before login (sign-up open?, password rules, supported languages)
      security: []
      x-source: H1
      x-roles: [public]
      x-wave: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
        '500': { $ref: '#/components/responses/ServerError' }

  /app/public/legal-documents:
    get:
      tags: [public]
      operationId: listLegalDocuments
      summary: Current terms of use and privacy notice (version the user must accept at sign-up)
      security: []
      x-source: H1 (PDC-156)
      x-roles: [public]
      x-wave: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LegalDocument' }

  # ───────────────────────────── auth ─────────────────────────────
  /app/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Self sign-up. Account starts with no role (sees nothing) until an admin grants one.
      description: |
        Always answers **202 with the same body** whether or not the e-mail already exists (no account enumeration).
        If it exists, the server e-mails the owner instead of creating a duplicate. The new account belongs to the
        server's configured sign-up tenant (MVP: one tenant) and must verify its e-mail before it can log in.
      security: []
      x-source: H1 (PDC-155)
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedCheckEmail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an e-mail address with the one-time token from the link (sign-up, invite, or e-mail change)
      security: []
      x-source: H1 (PDC-155)
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 256 }
      responses:
        '200':
          description: Verified. `next` tells the UI where to go.
          content:
            application/json:
              schema:
                type: object
                required: [purpose, next]
                properties:
                  purpose: { type: string, enum: [signup, invite, email_change] }
                  next: { type: string, enum: [login, set_password] }
                  set_password_token:
                    type: string
                    description: Only for `invite` — use with `POST /app/auth/password/reset`.
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Re-send the verification e-mail (same 202 whether or not the account exists)
      security: []
      x-source: H1 (PDC-155)
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnly' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedCheckEmail' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Step 1 — e-mail + password
      description: |
        Wrong e-mail and wrong password give the **same** 401 `auth.invalid_credentials` (X1 §0 rule 1).
        `auth.email_not_verified` and `auth.account_deactivated` are only returned after the password was correct.
      security: []
      x-source: 03 §3.6
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Password accepted. Look at `status` for the next step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Step 2 — 6-digit TOTP code or one recovery code
      security: []
      x-source: 03 §3.6
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/mfa/setup:
    post:
      tags: [auth]
      operationId: startMfaSetup
      summary: Start TOTP enrolment — returns a QR image and the manual key (short-lived, bound to this session)
      description: |
        Called either during login (`challenge_id` from a `mfa_setup_required` LoginResult) or later from the account
        page (authenticated, no body needed). The QR is a PNG data URI — show it in `<img>`, never inject as HTML.
      security: [{}, { sessionCookie: [] }]
      x-source: H1 (03 had no setup endpoint; PDC-138)
      x-roles: [public-with-challenge, authenticated]
      x-wave: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_id: { type: string }
      responses:
        '200':
          description: Scan this, then confirm with a code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /app/auth/mfa/setup/confirm:
    post:
      tags: [auth]
      operationId: confirmMfaSetup
      summary: Confirm enrolment with the first code — returns recovery codes ONCE
      security: [{}, { sessionCookie: [] }]
      x-source: H1 (PDC-138)
      x-roles: [public-with-challenge, authenticated]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_id, code]
              properties:
                setup_id: { type: string }
                code: { $ref: '#/components/schemas/TotpCode' }
                challenge_id: { type: string, description: Present when enrolling during login }
      responses:
        '200':
          description: Enrolled. Show `recovery_codes` once (download/print) — the server keeps only hashes.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
                    minItems: 1
                  login: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /app/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End this session
      x-source: 03 §3.6
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Logged out (cookie cleared) }

  /app/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session facts — CSRF token after a page reload, and when the session will expire
      x-source: H1
      x-roles: [authenticated]
      x-wave: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /app/auth/context:
    post:
      tags: [auth]
      operationId: setActiveTenant
      summary: Choose which tenant to work in (X1 S4). Server sets the tenant context for RLS.
      x-source: H1 (X1 S4)
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
      responses:
        '200':
          description: Context switched — returns the refreshed Me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /app/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: E-mail a reset link (same 202 whether or not the account exists)
      security: []
      x-source: H1 (PDC-155)
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnly' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedCheckEmail' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with the one-time token (also used by invite links). Ends all other sessions.
      security: []
      x-source: H1 (PDC-155)
      x-roles: [public]
      x-wave: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, minLength: 16, maxLength: 256 }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password set — go to login }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Re-authenticate for a high-risk action without granting new permissions
      x-source: 'H1 X4 S4; local rule.md rule 47 and own-account erasure'
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              description: Admin account actions require MFA code; own-account high-risk actions may use password or code under the approved policy. Go verifies actor, purpose and expiry on use; credentials are never logged.
              oneOf:
                - required: [code]
                  not: { required: [password] }
                - required: [password]
                  not: { required: [code] }
              properties:
                purpose: { type: string, minLength: 1 }
                code: { $ref: '#/components/schemas/TotpCode' }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Send the purpose-bound step_up_token as X-Step-Up-Token; Go verifies actor, purpose and configured expiry for the action
          content:
            application/json:
              schema:
                type: object
                required: [step_up_token, expires_at]
                properties:
                  step_up_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── account (own) ─────────────────────────────
  /app/users/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Who am I — memberships, roles in the active tenant, MFA state, consents to accept, tutorial status
      description: '`has_any_role=false` → show the waiting-for-access page only (X1 S5).'
      x-source: 03 §3.6
      x-roles: [authenticated]
      x-wave: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /app/account/profile:
    patch:
      tags: [account]
      operationId: updateProfile
      summary: Change display name
      x-source: H1 (PDC-155)
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/account/email-change:
    post:
      tags: [account]
      operationId: requestEmailChange
      summary: Change e-mail — link goes to the NEW address; old address gets a notice
      x-source: H1 (PDC-155)
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, current_password]
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
                current_password: { type: string, maxLength: 256 }
      responses:
        '202': { $ref: '#/components/responses/AcceptedCheckEmail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/account/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change password (needs the current one). Ends all other sessions.
      x-source: H1 (PDC-155)
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 256 }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/account/mfa:
    get:
      tags: [account]
      operationId: getMyMfa
      summary: MFA status of my account
      x-source: H1 (PDC-138)
      x-roles: [authenticated]
      x-wave: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
    delete:
      tags: [account]
      operationId: disableMyMfa
      summary: Turn MFA off — refused (409) while any of my roles requires it
      x-source: H1 (PDC-138)
      x-roles: [authenticated]
      x-wave: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/StepUpHeader'
      responses:
        '204': { description: Disabled }
        '403': { $ref: '#/components/responses/Forbidden' }
