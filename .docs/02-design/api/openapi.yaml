      summary: Run Analyze. 200 = served from cache (same inputs, seed, snapshot, models). 202 = running — poll the run.
      x-source: 03 §3.3 (async shape added, H1)
      x-roles: ['≥1 UserRole (tenant owner)']
      x-wave: 2
      parameters:
        - $ref: '#/components/parameters/FormulaId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1, description: Defaults to latest }
                seed:
                  type: integer
                  format: int64
                  description: Omit to let the server choose. Changing it must be shown clearly (R1 §0 rule 6).
      responses:
        '200':
          description: Completed (from cache)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /app/analysis-runs/{run_id}:
    get:
      tags: [analyze]
      operationId: getAnalysisRun
      summary: Progress of a run — real sub-steps per module (R1 S3), not a single spinner
      x-source: H1 (R1 S3; AnalysisRun 00 §6.4.2)
      x-roles: ['≥1 UserRole (tenant owner)']
      x-wave: 2
      parameters:
