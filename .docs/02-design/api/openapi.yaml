  # ───────────────────────────── compliance ─────────────────────────────
  /app/formulas/{formula_id}/compliance-findings:
    get:
      tags: [compliance]
      operationId: getComplianceReport
      summary: Findings grouped by jurisdiction (EU/TH/ASEAN/US never merged), hard block, disclaimer from data
      x-source: 03 §3.3 (response shaped for R2 S1, H1)
