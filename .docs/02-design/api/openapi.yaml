  # ───────────────────────────── lab ─────────────────────────────
  /app/batches:
    get:
      tags: [lab]
      operationId: listBatches
      summary: Batches of my tenant
      x-source: H1 (03 had none)
      x-roles: ['≥1 UserRole']
      x-wave: 3
      parameters:
        - name: formula_id
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [in_progress, blocked, complete] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
