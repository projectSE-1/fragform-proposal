          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/batches/{batch_id}:
    get:
      tags: [lab]
      operationId: getBatch
