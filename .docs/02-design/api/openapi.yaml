        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WeighingInput'
                - type: object
                  required: [reason]
                  properties:
                    reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: New row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchComponent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/batches/{batch_id}/components/{component_id}/pre-dilution:
    post:
      tags: [lab]
      operationId: recordPreDilution
      summary: The only way out of BLOCK — record the dilution you prepared; server returns a new row to weigh the solution
      description: No role can skip BLOCK (user decision 2026-09-23). The dilution ratio comes from the user; the new target is computed by the server.
      x-source: H1 (X3 S3)
      x-roles: [formulator]
      x-wave: 3
      x-pending: PDC-152 (SamplePrepRecord has no tenant_id yet)
      parameters:
        - $ref: '#/components/parameters/BatchId'
