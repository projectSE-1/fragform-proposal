        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreDilutionInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [sample_prep_id, new_component]
                properties:
                  sample_prep_id: { type: string }
                  new_component: { $ref: '#/components/schemas/BatchComponent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/batches/{batch_id}/mixing-sheet:
