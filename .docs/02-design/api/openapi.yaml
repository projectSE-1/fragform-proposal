                lot_id: { type: string }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchComponent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/batches/{batch_id}/components/{component_id}:
    patch:
      tags: [lab]
      operationId: recordWeighing
      summary: Record what was actually weighed on the chosen balance. Always stored, even when the verdict is BLOCK.
      description: |
        The server computes `u_mass`, `rel_u` and the verdict (WARN 10–20 %, BLOCK > 20 %, PDC-56) — the UI only shows them.
        A row can be recorded once; weighing again is `…/reweigh` with a reason (append-only).
        If per-item balances (PDC-148) are not live yet, `Batch.per_item_balance_supported=false` and the batch balance is used.
      x-source: 03 §3.4
      x-roles: [formulator]
      x-wave: 3
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/ComponentId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeighingInput' }
      responses:
        '200':
          description: Recorded — read `verdict`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchComponent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /app/batches/{batch_id}/components/{component_id}/reweigh:
    post:
      tags: [lab]
      operationId: reweighComponent
      summary: Weigh again — creates a new row that supersedes the old one (old row kept). Reason required.
      x-source: H1 (X3 S2; PDC-158)
      x-roles: [formulator]
      x-wave: 3
      x-pending: PDC-158 (BatchComponent.supersedes_component_id + reweigh_reason not in 00 yet)
      parameters:
